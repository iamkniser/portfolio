<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Никита Кривошеев — ведущий фронтенд-разработчик</title>
    <meta
      name="description"
      content="Делаю SaaS-продукты целиком — от схемы базы данных до продакшна. React, Next.js, TypeScript, Supabase. Последние три проекта вёл в одиночку."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://krivosheyev.dev/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1512" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Никита Кривошеев — ведущий фронтенд-разработчик" />
    <meta property="og:description" content="Делаю SaaS-продукты целиком — от схемы базы данных до продакшна. Последние три проекта вёл в одиночку." />
    <!-- Абсолютный URL обязателен: часть соцсетей не разворачивает относительный путь -->
    <meta property="og:url" content="https://krivosheyev.dev/" />
    <meta property="og:image" content="https://krivosheyev.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Никита Кривошеев",
        "jobTitle": "Ведущий фронтенд-разработчик",
        "email": "mailto:nik.krivosheyev@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Астана",
          "addressCountry": "KZ"
        },
        "knowsAbout": ["React", "Next.js", "TypeScript", "Supabase", "PostgreSQL"]
      }
    </script>

    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
